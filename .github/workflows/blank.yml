name: Get LocalStack
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: |
          docker pull --platform linux/arm64 localstack/localstack:latest
          docker save localstack/localstack:latest | gzip > localstack.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: localstack-arm64
          path: localstack.tar.gz
