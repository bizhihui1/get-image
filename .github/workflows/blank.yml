name: Download Terraform AWS Provider

on:
  workflow_dispatch: # 允许手动点击按钮触发

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Create Terraform Config
        run: |
          mkdir -p workspace
          cat << 'EOF' > workspace/main.tf
          terraform {
            required_providers {
              aws = {
                source  = "hashicorp/aws"
                version = "~> 5.0"
              }
            }
          }
          EOF

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Mirror Linux ARM64 Provider
        run: |
          cd workspace
          terraform providers mirror -platform=linux_arm64 ./offline-plugins
          tar -czvf ../aws-provider-linux-arm64.tar.gz offline-plugins

      - name: Upload Offline Package
        uses: actions/upload-artifact@v4
        with:
          name: aws-provider-linux-arm64
          path: aws-provider-linux-arm64.tar.gz
